databases:
  - name: order-enquiry-db
    plan: free
    databaseName: orders
    user: orders

services:
  - type: web
    name: order-enquiry-backend
    env: python
    plan: free
    rootDir: backend
    autoDeploy: false
    buildCommand: pip install -r ../requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: order-enquiry-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://order-enquiry-frontend.onrender.com

  - type: web
    name: order-enquiry-frontend
    env: static
    rootDir: frontend
    autoDeploy: false
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://order-enquiry-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
